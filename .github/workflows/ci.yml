name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Install SCons
        shell: pwsh
        run: python -m pip install scons

      - name: Cache TDLib and vcpkg
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/vcpkg/vcpkg.exe
            thirdparty/vcpkg/installed
            thirdparty/vcpkg/packages
            thirdparty/vcpkg/downloads
            thirdparty/td/build
            thirdparty/tdlib_win_x86_64
          key: tdlib-windows-${{ hashFiles('thirdparty/build.ps1') }}-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Build TDLib
        shell: pwsh
        working-directory: thirdparty
        run: .\build.ps1

      - name: Build GDExtension
        shell: pwsh
        run: scons target=template_debug

      - name: Upload GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: godot-tdlib-windows-debug
          path: addons/godot-tdlib/bin/godot_tdlib_win_x86_64

      - name: Download Godot
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_win64.exe.zip `
            -OutFile godot-ci.zip
          Expand-Archive -Path godot-ci.zip -DestinationPath godot-ci

      - name: Run headless tests
        shell: pwsh
        run: .\godot-ci\Godot_v4.5.2-stable_win64.exe --path .\tests --headless

  linux:
    name: Linux build and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev php-cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Cache TDLib build
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/td/build
            thirdparty/tdlib_linux_x86_64
          key: tdlib-linux-${{ hashFiles('thirdparty/build.sh') }}-${{ hashFiles('thirdparty/td/CMakeLists.txt') }}

      - name: Build TDLib
        working-directory: thirdparty
        run: bash ./build.sh

      - name: Upload include files of TDLib
        uses: actions/upload-artifact@v4
        with:
          name: godot-tdlib-linux-debug
          path: thirdparty/tdlib_linux_x86_64/include

      - name: Build GDExtension
        run: scons platform=linux target=template_debug

      - name: Download Godot
        run: |
          curl -L \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -o godot-ci.zip
          unzip -q godot-ci.zip -d godot-ci

      - name: Run headless tests
        run: ./godot-ci/Godot_v4.5.2-stable_linux.x86_64 --path ./tests --headless

  docs:
    name: Check generated documentation
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GDExtension
        uses: actions/download-artifact@v4
        with:
          name: godot-tdlib-windows-debug
          path: addons/godot-tdlib/bin/godot_tdlib_win_x86_64

      - name: Download Godot
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_win64.exe.zip `
            -OutFile godot-ci.zip
          Expand-Archive -Path godot-ci.zip -DestinationPath godot-ci

      - name: Check generated documentation
        shell: pwsh
        run: .\scripts\check_docs.ps1 -GodotPath .\godot-ci\Godot_v4.5.2-stable_win64.exe

  android:
    name: Android build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Android TDLib
        uses: actions/cache@v4
        with:
          path: thirdparty/tdlib_android/builds
          key: tdlib-android-${{ hashFiles('thirdparty/build_android.sh', 'thirdparty/tdlib_android/Dockerfile', 'thirdparty/tdlib_android/*.sh') }}

      - name: Build TDLib for Android
        working-directory: thirdparty
        run: |
          if [ ! -f tdlib_android/builds/tdlib.zip ]; then
            bash ./build_android.sh
          else
            echo "Using cached Android TDLib build"
          fi

      - name: Build Android GDExtension image
        run: docker build --tag godot-tdlib-android-builder .

      - name: Build Android GDExtension
        run: |
          for target in template_debug template_release; do
            for arch in x86_32 x86_64 arm32 arm64; do
              docker run --rm \
                --volume "$GITHUB_WORKSPACE:/build" \
                godot-tdlib-android-builder \
                scons -j"$(nproc)" platform=android target="$target" arch="$arch"
            done
          done

      - name: Upload Android GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: godot-tdlib-android-debug-release
          path: addons/godot-tdlib/bin