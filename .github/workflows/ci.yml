name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_tdlib:
    name: Windows TDLib
    runs-on: windows-latest
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache TDLib and vcpkg
        id: cache-tdlib-windows
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/vcpkg/vcpkg.exe
            thirdparty/vcpkg/installed
            thirdparty/vcpkg/packages
            thirdparty/vcpkg/downloads
            thirdparty/td/build
            thirdparty/tdlib_win_x86_64
          key: tdlib-windows-v2-${{ hashFiles('thirdparty/build.ps1') }}-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Build TDLib
        if: steps.cache-tdlib-windows.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: thirdparty
        run: .\build.ps1
  windows:
    name: Windows extension and tests
    needs: windows_tdlib
    runs-on: windows-latest
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        shell: pwsh
        run: python -m pip install scons

      - name: Restore TDLib and vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            thirdparty/vcpkg/vcpkg.exe
            thirdparty/vcpkg/installed
            thirdparty/vcpkg/packages
            thirdparty/vcpkg/downloads
            thirdparty/td/build
            thirdparty/tdlib_win_x86_64
          key: tdlib-windows-v2-${{ hashFiles('thirdparty/build.ps1') }}-vcpkg-9e593bb18ea69cc5095e012465dcd675a822ed0d
          fail-on-cache-miss: true
      
      - name: Cache GDExtension
        uses: actions/cache@v4
        with:
          path: | 
            addons/godot-tdlib/bin/godot_tdlib_win_x86_64
            ./.sconsign.dblite
            ./src/*.obj
            ./src/gen/*.cpp
            ./src/gen/*.obj
          key: gdextension-windows-${{ hashFiles('./SConstruct') }}-${{ hashFiles('./build_profile.json') }}

      - name: Build GDExtension
        shell: pwsh
        run: scons target=template_debug && scons target=template_release

      - name: Upload GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: godot-tdlib-windows-debug-release
          path: addons/godot-tdlib/bin/godot_tdlib_win_x86_64/*
          if-no-files-found: error

      - name: Download Godot
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_win64.exe.zip `
            -OutFile godot-ci.zip
          Expand-Archive -Path godot-ci.zip -DestinationPath godot-ci

      - name: Run headless tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          $requiredFiles = @(
            '.\addons\godot-tdlib\bin\godot_tdlib_win_x86_64\godot_tdlib_debug.dll',
            '.\addons\godot-tdlib\bin\godot_tdlib_win_x86_64\libcrypto-3-x64.dll',
            '.\addons\godot-tdlib\bin\godot_tdlib_win_x86_64\libssl-3-x64.dll',
            '.\addons\godot-tdlib\bin\godot_tdlib_win_x86_64\tdjson.dll',
            '.\addons\godot-tdlib\bin\godot_tdlib_win_x86_64\z.dll'
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path $_) })
          if ($missingFiles.Count -gt 0) {
            throw "Windows GDExtension files are missing: $($missingFiles -join ', ')"
          }
          .\godot-ci\Godot_v4.5-stable_win64.exe --path .\tests --headless --audio-driver Dummy --display-driver headless

  linux_tdlib:
    name: Linux TDLib
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev php-cli

      - name: Cache TDLib build
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/tdlib_linux_x86_64
          key: tdlib-linux-${{ hashFiles('thirdparty/build.sh') }}-${{ hashFiles('thirdparty/td/CMakeLists.txt') }}

      - name: Build TDLib
        working-directory: thirdparty
        run: |
          if [ ! -f tdlib_linux_x86_64/lib/libtdjson.so.1.8.67 ]; then
            bash ./build.sh
          else
            echo "Using cached Linux TDLib build"
          fi

  linux:
    name: Linux extension and tests
    needs: linux_tdlib
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Godot rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools libasound2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Restore TDLib cache
        uses: actions/cache@v4
        with:
          path: thirdparty/tdlib_linux_x86_64
          key: tdlib-linux-${{ hashFiles('thirdparty/build.sh') }}-${{ hashFiles('thirdparty/td/CMakeLists.txt') }}

      - name: Cache GDExtension
        uses: actions/cache@v4
        with:
          path: | 
            addons/godot-tdlib/bin/godot_tdlib_linux_x86_64
            ./.sconsign.dblite
            ./src/*.so
            ./src/gen/*.cpp
            ./src/gen/*.so
          key: gdextension-linux-${{ hashFiles('./SConstruct') }}-${{ hashFiles('./build_profile.json') }}
      
      - name: Build GDExtension
        run: |
          scons -j"$(nproc)" platform=linux target=template_debug
          scons -j"$(nproc)" platform=linux target=template_release

      - name: Upload GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: godot-tdlib-linux-debug-release
          path: addons/godot-tdlib/bin/godot_tdlib_linux_x86_64/*
          if-no-files-found: error

      - name: Download Godot
        run: |
          curl -L \
            https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip \
            -o godot-ci.zip
          unzip -q godot-ci.zip -d godot-ci

      - name: Run headless tests
        timeout-minutes: 5
        run: |
          required_files=(
            addons/godot-tdlib/bin/godot_tdlib_linux_x86_64/libgodot_tdlib_debug.so
            addons/godot-tdlib/bin/godot_tdlib_linux_x86_64/libtdjson.so.1.8.67
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Linux GDExtension file is missing: $file"
              exit 1
            fi
          done
          extension_dir="$GITHUB_WORKSPACE/addons/godot-tdlib/bin/godot_tdlib_linux_x86_64"
          echo "Linux GDExtension dependencies:"
          ldd "$extension_dir/libgodot_tdlib_debug.so"
          if ldd "$extension_dir/libgodot_tdlib_debug.so" | grep -q 'not found'; then
            echo "Linux GDExtension has unresolved shared-library dependencies"
            exit 1
          fi
          export LD_LIBRARY_PATH="$extension_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./godot-ci/Godot_v4.5-stable_linux.x86_64 --path ./tests --headless --audio-driver Dummy --display-driver headless
          LASTERRCODE=$?
          if [$LASTERRCODE -eq 134]; then
            echo "Warning: catched error 134 on exit"
            exit 0
          else
            exit $LASTERRCODE
          fi

  docs:
    name: Check generated documentation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation API
        shell: pwsh
        run: |
          .\scripts\check_docs.ps1 -GeneratedPath .\generated-docs

      - name: Upload generated documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-check-results
          path: generated-docs
          if-no-files-found: warn

  android:
    name: Android build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Android TDLib
        uses: actions/cache@v4
        with:
          path: thirdparty/tdlib_android/builds
          key: tdlib-android-${{ hashFiles('thirdparty/build_android.sh', 'thirdparty/tdlib_android/Dockerfile', 'thirdparty/tdlib_android/*.sh') }}

      - name: Build TDLib for Android
        working-directory: thirdparty
        run: |
          if [ ! -f tdlib_android/builds/tdlib.zip ]; then
            bash ./build_android.sh
          else
            echo "Using cached Android TDLib build"
          fi

      - name: Upload Android TDLib
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: thirdparty/tdlib_android/builds/tdlib/libs/
          if-no-files-found: error

      - name: Build Android GDExtension image
        run: docker build --tag godot-tdlib-android-builder .

      - name: Build Android GDExtension
        run: |
          for target in template_debug template_release; do
            for arch in x86_32 x86_64 arm32 arm64; do
              docker run --rm \
                --volume "$GITHUB_WORKSPACE:/build" \
                godot-tdlib-android-builder \
                scons -j"$(nproc)" platform=android target="$target" arch="$arch"
            done
          done

      - name: Upload Android GDExtension
        uses: actions/upload-artifact@v4
        with:
          name: godot-tdlib-android-debug-release
          path: addons/godot-tdlib/bin
          if-no-files-found: error